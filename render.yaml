# ATA Deployment - Render.com
# Uses MongoDB Atlas - create a free cluster and set MONGODB_URI.

services:
  - type: web
    name: ata-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt && pip uninstall -y sentence-transformers torch transformers huggingface_hub tokenizers torchaudio torchvision langchain-mongodb langchain langchain-classic 2>/dev/null || true
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: OPENAI_API_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: ata
      # Set CORS_ORIGINS to your frontend URL after deploy, e.g. https://ata-frontend.onrender.com
      - key: CORS_ORIGINS
        value: http://localhost:3000
      # Block any accidental HuggingFace model downloads (no local models used)
      - key: TRANSFORMERS_OFFLINE
        value: "1"
      - key: HF_DATASETS_OFFLINE
        value: "1"
      - key: TOKENIZERS_PARALLELISM
        value: "false"

  - type: web
    name: ata-frontend
    runtime: node
    rootDir: frontend
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: ata-backend
          property: host
