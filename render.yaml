# ATA Deployment - Render.com
# Uses MongoDB Atlas - create a free cluster and set MONGODB_URI.

services:
  - type: web
    name: ata-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: OPENAI_API_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: ata
      # Allow all CORS origins for demo purposes and cross-service communication
      - key: CORS_ORIGINS
        value: "*"
      # Optional Hugging Face token for higher rate-limit serverless embeddings
      - key: HF_TOKEN
        sync: false

  - type: web
    name: ata-frontend
    runtime: node
    rootDir: frontend
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: ata-backend
          property: host
